on:
  push:
    branches: [main]
  pull_request:

name: check

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::testthat, any::Rcpp, any::knitr, any::rmarkdown
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      # Dogfood: check this package with itself.
      - uses: ./
        with:
          args: "--no-manual"

      # End-to-end: the synthetic benchmark packages must pass.
      - name: Fixtures
        shell: bash
        run: |
          Rscript bench/make-fixtures.R bench/fixtures
          for p in cppheavy rheavy; do
            Rscript -e 'fastrcmdcheck::fastcheck_cli()' --error-on warning bench/fixtures/$p
          done
